services:
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - ./data-db:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

  storage:
    image: minio/minio:latest
    restart: always
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID is required}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY is required}
    command: server /data --console-address ":9001"
    volumes:
      - ./data-s3:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  create-buckets:
    image: minio/mc:latest
    depends_on:
      - storage
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID is required}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY is required}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
      MINIO_ENDPOINT: http://storage:9000
    volumes:
      - ./scripts/create-minio-bucket.sh:/usr/local/bin/create-minio-bucket.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/create-minio-bucket.sh"]

  mlflow:
    image: ghcr.io/mlflow/mlflow:${MLFLOW_VERSION:?MLFLOW_VERSION is required}
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      create-buckets:
        condition: service_completed_successfully
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID is required}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY is required}
      MLFLOW_S3_ENDPOINT_URL: ${MLFLOW_S3_ENDPOINT_URL:-http://storage:9000}
    command:
      - /bin/sh
      - -c
      - |
        pip install --no-cache-dir psycopg2-binary boto3

        mlflow server \
          --host "${MLFLOW_HOST:-0.0.0.0}" \
          --port "${MLFLOW_PORT:-5000}" \
          --backend-store-uri "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}" \
          --serve-artifacts \
          --artifacts-destination "s3://${S3_BUCKET}/"
    expose:
      - "${MLFLOW_PORT:-5000}"

  nginx:
    image: nginx:alpine
    restart: always
    depends_on:
      - mlflow
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.htpasswd:/etc/nginx/.htpasswd:ro
