upstream mlflow_backend {
    server mlflow:5000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Allow larger artifact/model uploads through MLflow.
    # Adjust this depending on your expected artifact size.
    client_max_body_size 2G;

    # Avoid request body buffering to disk for large uploads.
    proxy_request_buffering off;

    # Health endpoint for Docker/Kubernetes/load balancers.
    # This is intentionally not protected by basic auth.
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        # Basic Auth Configuration
        auth_basic "Restricted Access - MLOps Server";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass http://mlflow_backend;

        # Preserve original request information.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;

        # HTTP/1.1 is safer for keepalive and upgrade-style requests.
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Timeouts for long artifact uploads/downloads or slow model operations.
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        send_timeout 600s;

        # Usually better for MLflow UI/API responses behind a local proxy.
        proxy_buffering off;

        # Do not let nginx rewrite redirects unexpectedly.
        proxy_redirect off;
    }
}
